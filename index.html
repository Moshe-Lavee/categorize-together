<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Categorize Together</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1f2937;--mute:#6b7280;--line:#e5e7eb;--accent:#4338ca;--ok:#15803d;--warn:#b45309}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,"Segoe UI",Arial,sans-serif;font-size:16px;line-height:1.45}
.banner{background:#fef3c7;color:#78350f;text-align:center;padding:6px 12px;font-size:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 20px;background:var(--card);border-bottom:1px solid var(--line);flex-wrap:wrap}
.top .t{font-weight:700}.top .m{color:var(--mute);font-size:14px}
main{max-width:1280px;margin:0 auto;padding:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
.center{max-width:720px;margin:40px auto;text-align:center}
h1{font-size:26px;margin:0 0 6px}h2{font-size:20px;margin:0 0 8px}h3{font-size:17px;margin:0 0 8px}
p{margin:6px 0}.mute{color:var(--mute)}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 14px}
button:hover{background:#f3f4f6}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button.primary:hover{background:#3730a3}
button.primary:disabled{opacity:.45;cursor:not-allowed}
button.danger{color:#b91c1c}
button.link{border:none;background:none;color:var(--accent);padding:4px 0}
button.sm{padding:3px 9px;font-size:14px}
input[type=text],input:not([type]),input[type=number],textarea,select{font:inherit;padding:8px 10px;border:1px solid #cbd5e1;border-radius:8px;width:100%;background:#fff}
textarea{resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px;text-align:start}
.two>div{display:flex;flex-direction:column;gap:8px}
.colsgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}
.col{background:var(--card);border:1px solid var(--line);border-top:5px solid var(--c);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px}
.col h3{color:var(--c)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 11px;font-size:15px;user-select:none}
.chip.sel{background:#e0e7ff;border-color:var(--accent)}
.chip.rel{border-color:var(--c);border-inline-start:6px solid var(--c);border-radius:8px;cursor:grab}
.chip.rel.picked{background:#fef9c3;box-shadow:0 0 0 2px #facc15}
.chip b{font-weight:600;color:var(--ok);font-size:12px}
.chip .n{font-size:12px;color:var(--mute)}
.chip .x{cursor:pointer;color:#b91c1c;font-weight:700;padding:0 2px}
.chip.in{background:#ecfdf5;border-color:#6ee7b7}
.grp{border-inline-start:5px solid var(--g,#999)}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
.spacer{flex:1}
.prog{height:10px;background:#e5e7eb;border-radius:6px;overflow:hidden;margin:8px 0}
.prog>i{display:block;height:100%;background:var(--ok)}
.name{display:inline-block;padding:3px 10px;border-radius:999px;background:#f3f4f6;margin:2px}
.name.ok{background:#dcfce7}
.code{font-size:44px;font-weight:800;letter-spacing:6px;color:var(--accent)}
.sort{display:grid;grid-template-columns:400px 1fr;gap:16px;align-items:start}
.lists{position:sticky;top:8px;max-height:calc(100vh - 20px);overflow:auto}
.lcard{border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0;background:#fcfcfd}
.lcard h4{margin:0 0 6px;font-size:15px}
.lrel{margin:6px 0}.lrel small{color:var(--c);font-weight:700;display:block;margin-bottom:3px}
.catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.cat{background:#fff;border:2px dashed #cbd5e1;border-radius:12px;padding:10px;min-height:120px}
.cat.over{border-color:var(--accent);background:#eef2ff}
.cat h4{margin:0 0 8px;font-size:16px}
.cat .chips{gap:5px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.tabs button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.stars{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(var(--min,340px),1fr))}
.starbox{background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px;cursor:pointer}
.starbox.big{cursor:default}
.star{width:100%;height:auto;display:block}
.star text{unicode-bidi:plaintext;font-family:inherit}
table.t{border-collapse:collapse;width:100%;background:#fff}
table.t th,table.t td{border:1px solid var(--line);padding:8px;vertical-align:top;text-align:start}
table.t th{background:#f3f4f6}
.legend span{display:inline-flex;align-items:center;gap:5px;margin-inline-end:14px}
.legend i{width:12px;height:12px;border-radius:50%;display:inline-block}
.merge{display:grid;grid-template-columns:1fr 1.3fr;gap:16px;align-items:start}
.err{color:#b91c1c;min-height:1.3em}
.lang{margin-top:14px;font-size:14px}.lang button{padding:2px 10px;font-size:14px}.lang button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.intro{max-width:900px;margin:20px auto}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:14px 0}
.step{border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14px;line-height:1.5}
.step b{display:block;font-size:15px;margin-bottom:4px}
.step .tm{color:var(--mute);font-size:13px;margin-top:6px}
.note{background:#eef2ff;color:#3730a3;border-radius:8px;padding:10px 12px;font-size:14px;line-height:1.6;margin:12px 0}
.setup{display:grid;grid-template-columns:1.1fr 1fr;gap:22px;align-items:start}
.fld-g{margin-bottom:14px}.fld-g label.l{font-weight:600;font-size:14px;display:block;margin-bottom:4px}
.fld-g small{display:block;color:var(--mute);font-size:13px;margin-top:3px}
.rowc{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.pv{border:1px dashed #94a3b8;border-radius:10px;padding:12px;background:#fafafa;position:sticky;top:8px}
.pv .pcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:6px}
.pv .pcols div{border:1px solid var(--line);border-top:3px solid var(--c);border-radius:6px;padding:6px;background:#fff;font-size:13px;min-height:84px}
.pv .pcols span{display:block;border-bottom:1px solid var(--line);height:14px;margin-top:5px}
@media (max-width:900px){.two,.merge,.sort,.setup{grid-template-columns:1fr}.lists,.pv{position:static;max-height:none}}
</style>
</head>

/* ============ עזרים ============ */
const norm = s => String(s==null?'':s).replace(/\s+/g,' ').trim().toLowerCase();
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const A = x => Array.isArray(x) ? x : (x && typeof x==='object' ? Object.values(x) : []);
const shuffle = a => a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
const rnd = a => a[Math.floor(Math.random()*a.length)];
const uid = () => Math.random().toString(36).slice(2,9);
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
const $ = s => document.querySelector(s);
const app = document.getElementById('app');

/* ============ שכבת אחסון: Firebase או מקומי ============ */
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('load '+src));document.head.appendChild(s);});}
const FORCE_LOCAL = /[?&]local(\b|=)/.test(location.search);

const store = {
  mode:'local', fb:null, ref:null, lkey:null, _room:null, _cb:null,
  async init(){
    if(FIREBASE_CONFIG && !FORCE_LOCAL){
      await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js');
      await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js');
      firebase.initializeApp(FIREBASE_CONFIG);
      this.fb = firebase.database(); this.mode='firebase';
    }
  },
  async get(room){
    if(this.mode==='firebase') return (await this.fb.ref('rooms/'+room).once('value')).val();
    return this._read(room);
  },
  listen(room, cb){
    this.unlisten();
    if(this.mode==='firebase'){
      this.ref = this.fb.ref('rooms/'+room);
      this.ref.on('value', s=>cb(s.val()));
    } else {
      this.lkey = 'ct_room_'+room; this._room = room; this._cb = cb;
      window.addEventListener('storage', this._onStorage);
      cb(this._read(room));
    }
  },
  _onStorage: e => { if(e.key===store.lkey) store._cb(store._read(store._room)); },
  unlisten(){
    if(this.ref){this.ref.off();this.ref=null;}
    window.removeEventListener('storage', this._onStorage);
    this.lkey=null; this._cb=null;
  },
  _read(room){ try{return JSON.parse(localStorage.getItem('ct_room_'+room));}catch(e){return null;} },
  set(room, path, val){
    if(this.mode==='firebase'){
      const r = path ? this.fb.ref('rooms/'+room+'/'+path) : this.fb.ref('rooms/'+room);
      return r.set(val===undefined?null:val);
    }
    let o = this._read(room);
    if(!path){
      if(val==null) localStorage.removeItem('ct_room_'+room); else localStorage.setItem('ct_room_'+room, JSON.stringify(val));
    } else {
      o = o || {};
      const ks = path.split('/'); let cur = o;
      for(let i=0;i<ks.length-1;i++){ if(typeof cur[ks[i]]!=='object'||cur[ks[i]]===null) cur[ks[i]]={}; cur=cur[ks[i]]; }
      const last = ks[ks.length-1];
      if(val==null) delete cur[last]; else cur[last]=val;
      localStorage.setItem('ct_room_'+room, JSON.stringify(o));
    }
    if(this._cb && this._room===room) this._cb(this._read(room));
    return Promise.resolve();
  }
};

function normalizeConfig(c){
  return {lang:c.lang==='en'?'en':'he', title:c.title||'', n1:c.n1||'', nN:c.nN||'',
    cols:A(c.cols).map(x=>({k:x.k,name:x.name,color:x.color})), start:+c.start||10, max:+c.max||15, pA:c.pA||'', pB:c.pB||''};
}
function queueSave(fn){ pendingSave = fn; clearTimeout(saveT); saveT = setTimeout(flushSave, 250); }

/* ============ נגזרות מהנתונים ============ */
function me(d){ return (d.students||{})[S.sid]; }
function doneCount(d,p){ return Object.values(d.students||{}).filter(s=>s.done && s.done[p]).length; }
function itemTextMap(d){
  const m={};
  Object.values(d.items||{}).forEach(it=>cols().forEach(r=>A(it&&it[r.k]).forEach(x=>{const k=r.k+'|'+norm(x); if(!m[k]) m[k]=String(x).trim();})));
  return m;
}
function rawCats(d){
  const map=new Map();
  Object.entries(d.cats||{}).forEach(([sid,arr])=>A(arr).forEach(x=>{
    const k=norm(x); if(!k) return;
    if(!map.has(k)) map.set(k,{key:k,voters:{},texts:{}});
    const m=map.get(k); m.voters[sid]=1; const tt=String(x).trim(); m.texts[tt]=(m.texts[tt]||0)+1;
  }));
  map.forEach(m=>{ m.n=Object.keys(m.voters).length; m.text=Object.entries(m.texts).sort((a,b)=>b[1]-a[1])[0][0]; });
  return map;
}
function pairSupport(d){
  const sup=new Map();
  Object.values(d.groups||{}).forEach(gs=>{
    const seen=new Set();
    A(gs).map(A).forEach(g=>{
      const ks=[...new Set(g.map(norm))].filter(Boolean);
      for(let i=0;i<ks.length;i++)for(let j=i+1;j<ks.length;j++){
        const pk=[ks[i],ks[j]].sort().join('\u0001');
        if(!seen.has(pk)){seen.add(pk);sup.set(pk,(sup.get(pk)||0)+1);}
      }
    });
  });
  return sup;
}
function groupSummary(d){
  const m=new Map();
  Object.values(d.groups||{}).forEach(gs=>A(gs).map(A).forEach(g=>{
    const ks=[...new Set(g.map(norm))].filter(Boolean).sort(); if(ks.length<2) return;
    const id=ks.join('\u0001'); if(!m.has(id)) m.set(id,{keys:ks,count:0}); m.get(id).count++;
  }));
  return [...m.values()].sort((a,b)=>b.count-a.count||b.keys.length-a.keys.length);
}
function finalList(d){ return A(d.final).map(c=>({id:c.id,name:c.name,members:A(c.members)})); }
function assignedKeys(fin){ const s=new Set(); fin.forEach(c=>c.members.forEach(k=>s.add(k))); return s; }

function aggregate(d, minVotes){
  const itemText=itemTextMap(d);
  const res=finalList(d).map(c=>({id:c.id,name:c.name,items:{}}));
  const byId=Object.fromEntries(res.map(c=>[c.id,c]));
  const students=new Set(); let total=0;
  Object.entries(d.assign||{}).forEach(([sid,m])=>Object.entries(m||{}).forEach(([cid,keys])=>{
    const c=byId[cid]; if(!c) return;
    A(keys).forEach(k=>{ total++; students.add(sid);
      c.items[k]=c.items[k]||{key:k,rel:k[0],text:itemText[k]||k.slice(2),voters:[]}; c.items[k].voters.push(sid); });
  }));
  const order=cols().map(c=>c.k);
  res.forEach(c=>{
    c.list=Object.values(c.items).filter(i=>i.voters.length>=minVotes)
      .sort((a,b)=>order.indexOf(a.rel)-order.indexOf(b.rel)||b.voters.length-a.voters.length);
  });
  return {res,total,students:students.size};
}

/* ============ חתימת מסך ============ */
function sig(d){
  if(!S.role) return 'pre:'+S.pre+':'+LANG;
  if(!d) return 'none';
  const p=d.phase||0, st=d.students||{};
  if(S.role==='teacher'){
    const names=Object.entries(st).map(([id,s])=>id+':'+s.name+':'+((s.done&&s.done[p])?1:0)).join(',');
    if(p===4) return [p,JSON.stringify(d.final||0),names].join('#');
    if(p===5) return [p,JSON.stringify(d.final||0),JSON.stringify(d.assign||0),Object.keys(st).length].join('#');
    return p+'#'+names;
  }
  const m=st[S.sid]; if(!m) return 'noMe';
  const done=(m.done&&m.done[p])?1:0;
  if(p===5) return [p,JSON.stringify(d.final||0),JSON.stringify((d.assign&&d.assign[S.sid])||0),Object.keys(st).length].join('#');
  if(p===3) return [p,done,JSON.stringify((d.groups&&d.groups[S.sid])||0),done?doneCount(d,p):''].join('#');
  return [p,done,done?doneCount(d,p):''].join('#');
}
function onData(d){
  S.loaded=true; S.data=d;
  CFG = d && d.config ? normalizeConfig(d.config) : null;
  if(CFG) LANG = CFG.lang;
  const s=sig(d);
  if(s!==lastSig){ flushSave(); lastSig=s; render(); }
}

  document.documentElement.setAttribute('dir', LANG==='he'?'rtl':'ltr');

  else if(!S.loaded) html='<main><div class="card center">'+tr('loading')+'</div></main>';
  else if(!S.data) html='<main><div class="card center"><h2>'+tr('roomGone')+'</h2><button data-act="leave">'+tr('back')+'</button></div></main>';
  else if(!CFG) html='<main><div class="card center"><h2>'+tr('errNoConfig')+'</h2><button data-act="leave">'+tr('back')+'</button></div></main>';
  else html = S.role==='teacher' ? viewTeacher(S.data) : viewStudent(S.data);
  const banner = store.mode==='local' ? '<div class="banner">'+tr('local')+'</div>' : '';
  app.innerHTML = banner+html;
}

function viewStudent(d){
  const m=me(d); if(!m) return '<main><div class="card center"><h2>'+tr('notInRoom')+'</h2><button data-act="leave">'+tr('back')+'</button></div></main>';
  const p=d.phase||0;
  const head=topbar(d,tr('studentLbl',S.name));
  const done=m.done&&m.done[p];
  let body='';
  if(p===0) body=`<div class="card center"><h2>${esc(tr('welcome',S.name))}</h2><p>${tr('waitStart')}</p></div>`;
  else if(p===4) body=`<div class="card center"><h2>${tr('teacherSumming')}</h2><p>${tr('soon')}</p></div>`;
  else if(p===5) body=viewS5(d);
  else if(done) body=waitingView(d,p);
  else if(p===1) body=viewS1(d);
  else if(p===2) body=viewS2(d);
  else if(p===3) body=viewS3(d);
  return head+'<main>'+body+'</main>';
}
function waitingView(d,p){
  const n=Object.keys(d.students||{}).length, k=doneCount(d,p);
  return `<div class="card center"><h2>${tr('doneTitle')}</h2><p>${tr('waitClass',k,n)}</p>
  <div class="prog"><i style="width:${n?Math.round(100*k/n):0}%"></i></div>
  <button data-act="reopen">${tr('reopen')}</button></div>`;
}
function ensureDraft(d){
  const own=(d.items&&d.items[S.sid])||{};
  if(!draft.items){
    draft.items={};
    cols().forEach(r=>{ const a=A(own[r.k]).map(String); while(a.length<CFG.start) a.push(''); draft.items[r.k]=a; });
  }
  if(!draft.cats){
    const a=A(d.cats&&d.cats[S.sid]).map(String); while(a.length<6) a.push(''); draft.cats=a;
  }
}
function viewS1(d){
  ensureDraft(d);
  const cs=cols().map(r=>`<section class="col" style="--c:${r.color}"><h3>${esc(r.name)}</h3>

function trunc(s,n){ s=String(s); return s.length>n? s.slice(0,n-1)+'…':s; }
function starSVG(c){
  const W=800,H=600,cx=400,cy=300, items=c.list, n=items.length;
  const fs=n>26?12:n>16?14:16;
  let o=`<svg viewBox="0 0 ${W} ${H}" class="star" direction="ltr">`;
  items.forEach((it,i)=>{
    const ang=-Math.PI/2+i*2*Math.PI/n, stag=(n>12&&i%2)?0.74:1;
    const x=cx+Math.cos(ang)*250*stag, y=cy+Math.sin(ang)*215*stag, col=colOf(it.rel).color;
    const w=1+Math.min(it.voters.length,6)*0.8, co=Math.cos(ang), si=Math.sin(ang);
    const lab=trunc(it.text+(it.voters.length>1?' ×'+it.voters.length:''),22);
    let tx=x, ty=y, anchor='middle';
    if(co>0.2){tx=x+9;anchor='start';ty=y+4;} else if(co<-0.2){tx=x-9;anchor='end';ty=y+4;} else {ty=si<0?y-11:y+20;}
    o+=`<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${col}" stroke-width="${w}" opacity=".55"/>
    <circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${4+Math.min(it.voters.length,5)}" fill="${col}"/>
    <text x="${tx.toFixed(1)}" y="${ty.toFixed(1)}" text-anchor="${anchor}" font-size="${fs}" fill="#1f2937"><title>${esc(it.text)} (${it.voters.length})</title>${esc(lab)}</text>`;
  });
  const words=c.name.split(' '); let l1=c.name,l2='';
  if(c.name.length>11&&words.length>1){ let best=1,bd=1e9; for(let i=1;i<words.length;i++){const a=words.slice(0,i).join(' ').length; const dd=Math.abs(a-c.name.length/2); if(dd<bd){bd=dd;best=i;}} l1=words.slice(0,best).join(' '); l2=words.slice(best).join(' '); }
  o+=`<ellipse cx="${cx}" cy="${cy}" rx="92" ry="48" fill="#312e81"/>
   <text x="${cx}" y="${l2?cy-3:cy+6}" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">${esc(trunc(l1,16))}</text>
   ${l2?`<text x="${cx}" y="${cy+21}" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">${esc(trunc(l2,16))}</text>`:''}</svg>`;
  return o;
}

    <button data-act="csv">${tr('csv')}</button>${debug?'<button data-act="seedassign">'+tr('seedAssign')+'</button>':''}</div>
   <div class="legend">${legend}</div></div>${main}`;
}

/* ============ פעולות ============ */
function finSave(arr){ store.set(S.room,'final',arr); }
function mutFin(fn){ const f=finalList(S.data); fn(f); finSave(f); }
function clusters(d, thr, onlyKeys){
  const raw=rawCats(d), sup=pairSupport(d), par={};
  const find=x=>par[x]===x?x:(par[x]=find(par[x]));
  onlyKeys.forEach(k=>par[k]=k);
  sup.forEach((v,pk)=>{ if(v<thr) return; const [a,b]=pk.split('\u0001'); if(par[a]!==undefined&&par[b]!==undefined) par[find(a)]=find(b); });
  const g={}; onlyKeys.forEach(k=>{(g[find(k)]=g[find(k)]||[]).push(k);});
  return Object.values(g).map(ks=>ks.sort((a,b)=>raw.get(b).n-raw.get(a).n));
}
function nameFor(raw,keys){ return raw.get(keys[0]).text; }
function addFinal(keys,name){ mutFin(f=>f.push({id:'c'+uid(),name,members:keys})); }
function setErr(m){ S.err=m; const e=$('#err'); if(e) e.textContent=m; }

const ACT = {
  setlang(el){ LANG=el.dataset.v; try{localStorage.setItem('ct_lang',LANG);}catch(e){} render(); },
  async join(){
    const code=($('#code').value||'').trim(), name=($('#name').value||'').trim();
    if(!/^\d{4}$/.test(code)) return setErr(tr('errCode'));
    if(!name) return setErr(tr('errName'));
    let room; try{ room=await store.get(code); }catch(e){ return setErr(tr('errConn')); }
    if(!room) return setErr(tr('errNoRoom'));
    if(!room.config) return setErr(tr('errNoConfig'));
    LANG = normalizeConfig(room.config).lang;
    let sid=null;
    const ex=Object.entries(room.students||{}).find(([id,s])=>norm(s.name)===norm(name));
    if(ex){ if(confirm(tr('nameExists',name))) sid=ex[0]; else return setErr(tr('errOther')); }
    if(!sid){ sid='s'+uid(); await store.set(code,'students/'+sid,{name,joined:Date.now()}); }
    sessionStorage.setItem('ct_student',JSON.stringify({room:code,sid,name}));
    startSession('student',code,sid,name);
  },
  newroom(){ let skip=false; try{skip=localStorage.getItem('ct_skipintro')==='1';}catch(e){} S.pre = skip?'setup':'intro'; S.err=''; render(); },
  tosetup(){ const c=$('#noshow'); if(c&&c.checked){ try{localStorage.setItem('ct_skipintro','1');}catch(e){} } S.pre='setup'; render(); },
  addcol(){ if(setup.cols.length<MAX_COLS) setup.cols.push(''); render(); },
  rmcol(el){ if(setup.cols.length>MIN_COLS) setup.cols.splice(+el.dataset.i,1); render(); },
  async createroom(){
    const cfg=effCfg();
    if(cfg.cols.length<MIN_COLS){ S.err=tr('errCols'); render(); return; }
    let code; do{ code=String(Math.floor(1000+Math.random()*9000)); }while(await store.get(code));
    await store.set(code,'',{phase:0,created:Date.now(),config:cfg});
    localStorage.setItem('ct_teacher',JSON.stringify({room:code}));
    setup=null; startSession('teacher',code);
  },
  resume(){ const t0=JSON.parse(localStorage.getItem('ct_teacher')); startSession('teacher',t0.room); },
  leave(){ store.unlisten(); S.role=null; S.pre=null; S.data=null; S.loaded=false; CFG=null; S.err=''; sessionStorage.removeItem('ct_student');
    try{ LANG=localStorage.getItem('ct_lang')||'he'; }catch(e){} lastSig=null; render(); },
  addfld(el){ const a=draft.items[el.dataset.rel]; if(a.length<CFG.max) a.push(''); render(); },
  addcat(){ draft.cats.push(''); render(); },
  done(){
    const d=S.data, p=d.phase;
    if(p===1){ const tot=cols().reduce((s,r)=>s+draft.items[r.k].filter(x=>x.trim()).length,0); if(!tot && !confirm(tr('emptyConfirm'))) return; }
    flushSave(); if(p===1) saveItems(); if(p===2) saveCats();
    store.set(S.room,'students/'+S.sid+'/done/'+p,true);
  },
  reopen(){ store.set(S.room,'students/'+S.sid+'/done/'+S.data.phase,null); },
  gtoggle(el){ const k=el.dataset.key; ui.group.has(k)?ui.group.delete(k):ui.group.add(k); render(); },
  mkgroup(){
    const raw=rawCats(S.data), g=[...ui.group].map(k=>raw.get(k)?raw.get(k).text:k);
    const gs=A(S.data.groups&&S.data.groups[S.sid]).map(A); gs.push(g); ui.group.clear();
    store.set(S.room,'groups/'+S.sid,gs);
  },
  rmgroup(el){ const gs=A(S.data.groups&&S.data.groups[S.sid]).map(A); gs.splice(+el.dataset.i,1); store.set(S.room,'groups/'+S.sid,gs); },
  openlist(el){ const id=el.dataset.id; ui.open.has(id)?ui.open.delete(id):ui.open.add(id); render(); },
  pick(el){ const k=el.dataset.key; ui.selItem = ui.selItem===k?null:k; render(); },
  putsel(el,e){ if(e.target.closest('[data-act="unassign"]')) return; if(ui.selItem){ addAssign(el.dataset.cid,ui.selItem); ui.selItem=null; } },
  unassign(el){ const cid=el.dataset.cid, key=el.dataset.key; const a=A(S.data.assign&&S.data.assign[S.sid]&&S.data.assign[S.sid][cid]).filter(k=>k!==key); store.set(S.room,'assign/'+S.sid+'/'+cid,a.length?a:null); },
  next(){
    const d=S.data,p=d.phase||0;
    if(p>=1&&p<=3){ const n=Object.keys(d.students||{}).length,k=doneCount(d,p); if(k<n && !confirm(tr('onlyDone',k,n))) return; }
    if(p===0&&!Object.keys(d.students||{}).length && !confirm(tr('noStudents'))) return;
    if(p===3){ ui.sel.clear(); }
    store.set(S.room,'phase',p+1);
  },
  prev(){ const p=S.data.phase||0; if(p>0) store.set(S.room,'phase',p-1); },
  seltoggle(el){ const k=el.dataset.key; ui.sel.has(k)?ui.sel.delete(k):ui.sel.add(k); render(); },
  selnone(){ ui.sel.clear(); render(); },
  mkfin(){
    const raw=rawCats(S.data), keys=[...ui.sel].sort((a,b)=>raw.get(b).n-raw.get(a).n);
    const name=prompt(tr('finName'),raw.get(keys[0]).text); if(!name||!name.trim()) return;
    ui.sel.clear(); addFinal(keys,name.trim());
  },
  addsel(el){ const id=el.dataset.id, keys=[...ui.sel]; ui.sel.clear(); mutFin(f=>{ const c=f.find(x=>x.id===id); if(c) keys.forEach(k=>{ if(!c.members.includes(k)) c.members.push(k); }); }); },
  rmmember(el){ mutFin(f=>{ const c=f.find(x=>x.id===el.dataset.id); if(c) c.members=c.members.filter(k=>k!==el.dataset.key); }); },
  renfin(el){ const c=finalList(S.data).find(x=>x.id===el.dataset.id); const n=prompt(tr('newName'),c.name); if(n&&n.trim()) mutFin(f=>{ f.find(x=>x.id===c.id).name=n.trim(); }); },
  delfin(el){ if(confirm(tr('delFinConfirm'))) mutFin(f=>{ const i=f.findIndex(x=>x.id===el.dataset.id); if(i>=0) f.splice(i,1); }); },
  auto(){
    const thr=Math.max(1,+($('#thr').value)||1); ui.thr=thr;
    const d=S.data, raw=rawCats(d), used=assignedKeys(finalList(d));
    const free=[...raw.keys()].filter(k=>!used.has(k));
    const cl=clusters(d,thr,free).filter(ks=>ks.length>=2);
    if(!cl.length){ alert(tr('noClusters')); return; }
    mutFin(f=>cl.forEach(ks=>f.push({id:'c'+uid(),name:nameFor(raw,ks),members:ks})));
  },
  restsingle(){
    const d=S.data, raw=rawCats(d), used=assignedKeys(finalList(d));
    const free=[...raw.values()].filter(c=>!used.has(c.key)).sort((a,b)=>b.n-a.n);
    if(!free.length) return;
    mutFin(f=>free.forEach(c=>f.push({id:'c'+uid(),name:c.text,members:[c.key]})));
  },
  adoptgrp(el){
    const d=S.data, raw=rawCats(d), used=assignedKeys(finalList(d));
    const g=groupSummary(d).slice(0,12)[+el.dataset.i];
    const keys=g.keys.filter(k=>!used.has(k)&&raw.has(k)).sort((a,b)=>raw.get(b).n-raw.get(a).n);
    if(!keys.length){ alert(tr('allAssigned')); return; }
    const name=prompt(tr('finName'),raw.get(keys[0]).text); if(!name||!name.trim()) return;
    addFinal(keys,name.trim());
  },
  tview(el){ ui.tview=el.dataset.v; render(); },
  focus(el){ ui.focus=el.dataset.id; ui.tview='one'; render(); },
  focus1(el){ ui.focus=el.dataset.id; render(); },
  csv(){
    const agg=aggregate(S.data,ui.minVotes); const rows=[tr('csvHead')];
    agg.res.forEach(c=>c.list.forEach(i=>rows.push([c.name,colOf(i.rel).name,i.text,i.voters.length])));
    const csv='﻿'+rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\r\n');
    const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})); a.download='results-'+S.room+'.csv'; a.click();
  },
  delroom(){ if(confirm(tr('delRoomConfirm'))){ store.set(S.room,'',null); localStorage.removeItem('ct_teacher'); } },
  seed(){ seedStudents(); },
  seedassign(){ seedAssign(); }
};

function startSession(role,room,sid,name){
  S.role=role; S.pre=null; S.room=room; S.sid=sid||null; S.name=name||null; S.loaded=false; S.data=null; S.err='';
  draft={items:null,cats:null}; lastSig=null; ui.sel.clear(); ui.group.clear(); ui.open.clear(); ui.selItem=null;
  render();
  store.listen(room,onData);
}
function saveItems(){
  const o={}; cols().forEach(r=>{ const seen=new Set(), a=[]; draft.items[r.k].forEach(s=>{ const x=s.trim(),k=norm(x); if(x&&!seen.has(k)){seen.add(k);a.push(x);} }); o[r.k]=a; });
  store.set(S.room,'items/'+S.sid,o);
}
function saveCats(){
  const seen=new Set(), a=[]; draft.cats.forEach(s=>{ const x=s.trim(),k=norm(x); if(x&&!seen.has(k)){seen.add(k);a.push(x);} });
  store.set(S.room,'cats/'+S.sid,a);
}
function addAssign(cid,key){
  const cur=A(S.data.assign&&S.data.assign[S.sid]&&S.data.assign[S.sid][cid]);
  if(cur.includes(key)) return;
  store.set(S.room,'assign/'+S.sid+'/'+cid,[...cur,key]);
}

/* ============ אירועים ============ */
app.addEventListener('click',e=>{ const el=e.target.closest('[data-act]'); if(el&&ACT[el.dataset.act]) ACT[el.dataset.act](el,e); });
app.addEventListener('input',e=>{
  const el=e.target; if(!el.classList) return;
  if(el.dataset.bind){
    const b=el.dataset.bind;
    if(b==='col') setup.cols[+el.dataset.i]=el.value; else setup[b]=el.value;
    if(b!=='lang'){ const p=$('#pv'); if(p) p.innerHTML=previewHTML(); }
    return;
  }
  if(!el.classList.contains('fld')) return;
  const i=+el.dataset.i;
  if(el.dataset.kind==='item'){ draft.items[el.dataset.rel][i]=el.value; queueSave(saveItems); }
  else { draft.cats[i]=el.value; queueSave(saveCats); }
});
app.addEventListener('change',e=>{
  if(e.target.dataset&&e.target.dataset.bind==='lang'){ setup.lang=e.target.value; LANG=setup.lang; try{localStorage.setItem('ct_lang',LANG);}catch(x){} render(); return; }
  if(e.target.id==='minv'){ ui.minVotes=Math.max(1,+e.target.value||1); render(); }
  if(e.target.id==='thr'){ ui.thr=Math.max(1,+e.target.value||1); }
});
app.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('fld')){
    e.preventDefault();
    const nx=[...e.target.closest('.col, .card').querySelectorAll('.fld')]; const j=nx.indexOf(e.target); if(nx[j+1]) nx[j+1].focus();
  }
});
app.addEventListener('dragstart',e=>{ const c=e.target.closest&&e.target.closest('[data-key][draggable="true"]'); if(c){ e.dataTransfer.setData('text/plain',c.dataset.key); e.dataTransfer.effectAllowed='copy'; } });
app.addEventListener('dragover',e=>{ const c=e.target.closest&&e.target.closest('.cat'); if(c){ e.preventDefault(); c.classList.add('over'); } });
app.addEventListener('dragleave',e=>{ const c=e.target.closest&&e.target.closest('.cat'); if(c&&!c.contains(e.relatedTarget)) c.classList.remove('over'); });
app.addEventListener('drop',e=>{ const c=e.target.closest&&e.target.closest('.cat'); if(c){ e.preventDefault(); c.classList.remove('over'); const k=e.dataTransfer.getData('text/plain'); if(k) addAssign(c.dataset.cid,k); } });

   [['ישו','d'],['מריה','d'],['האפיפיור','d'],['חג המולד','h'],['פסחא','h'],['בית לחם','p'],['ירושלים','p'],['ברית חדשה','b'],['תהילים','b'],['טבילה','t'],['מיסה','t'],['כנסייה','m'],['כומר','m']],

   [['Moses','d'],['Abraham','d'],['Sabbath','h'],['Passover','h'],['Jerusalem','p'],['Western Wall','p'],['Torah','b'],['Talmud','b'],['Bar Mitzvah','t'],['Circumcision','t'],['Synagogue','m'],['Rabbi','m'],['Kashrut','t']],
   [['Jesus','d'],['Mary','d'],['The Pope','d'],['Christmas','h'],['Easter','h'],['Bethlehem','p'],['Jerusalem','p'],['New Testament','b'],['Psalms','b'],['Baptism','t'],['Mass','t'],['Church','m'],['Priest','m']],
   [['Muhammad','d'],['Abraham','d'],['Ramadan','h'],['Eid al-Fitr','h'],['Mecca','p'],['Jerusalem','p'],['Quran','b'],['Hadith','b'],['Fasting','t'],['Hajj','t'],['Mosque','m'],['Imam','m']]],
  fam:{d:['Figures','People','Key figures'],h:['Festivals','Holidays'],p:['Holy places','Places','Sites'],b:['Holy books','Scriptures'],t:['Rituals','Customs','Worship'],m:['Institutions','Clergy and institutions']}}
};
function seedStudents(){
  const D=DEMO[LANG]||DEMO.he, r=S.room, cs=cols();
  const all=D.names.map((nm,i)=>{
    const items={}; cs.forEach((x,ci)=>{ items[x.k]=shuffle(D.items[ci%3]).slice(0,7+Math.floor(Math.random()*4)).map(a=>a[0]); });
    const fams=shuffle(Object.keys(D.fam)).slice(0,4+Math.floor(Math.random()*3));
    return {id:'demo'+i,nm,items,cats:fams.map(f=>rnd(D.fam[f]))};
  });
  const union=new Set(all.flatMap(s=>s.cats));
  all.forEach(s=>{
    const groups=[]; Object.values(D.fam).forEach(vs=>{ const g=vs.filter(v=>union.has(v)&&Math.random()<.85); if(g.length>1) groups.push(g); });
    store.set(r,'students/'+s.id,{name:s.nm,done:{1:true,2:true,3:true},demo:true});
    store.set(r,'items/'+s.id,s.items); store.set(r,'cats/'+s.id,s.cats); store.set(r,'groups/'+s.id,groups);
  });
}
function seedAssign(){
  const D=DEMO[LANG]||DEMO.he, d=S.data, fin=finalList(d), FAMOF={};
  cols().forEach((x,ci)=>D.items[ci%3].forEach(([tx,f])=>FAMOF[x.k+'|'+norm(tx)]=f));
  const famCat={}; Object.entries(D.fam).forEach(([f,vs])=>{ const c=fin.find(c=>vs.some(v=>c.members.includes(norm(v)))); if(c) famCat[f]=c.id; });
  Object.entries(d.students||{}).filter(([id,s])=>s.demo).forEach(([id])=>{
    const a={}; cols().forEach(x=>A(d.items&&d.items[id]&&d.items[id][x.k]).forEach(tx=>{
      const key=x.k+'|'+norm(tx), cid=famCat[FAMOF[key]]; if(cid&&Math.random()<.85) (a[cid]=a[cid]||[]).push(key);
    }));
    store.set(S.room,'assign/'+id,a);
  });
}

  try{ await store.init(); }catch(e){ app.innerHTML='<main><div class="card center"><h2>Firebase connection error</h2><p>'+esc(e.message)+'</p></div></main>'; return; }
  let saved=null; try{ saved=JSON.parse(sessionStorage.getItem('ct_student')); }catch(e){}
  if(saved && saved.room){ startSession('student',saved.room,saved.sid,saved.name); } else render();
})();
